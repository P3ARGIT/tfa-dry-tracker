plugins {
    id 'java'
}

repositories {
    maven { url = 'https://repo.runelite.net'; content { includeGroupByRegex('net\\.runelite.*') } }
    mavenCentral()
}

group = 'com.tfadrytracker'
version = '1.0.2'

dependencies {
    compileOnly 'net.runelite:client:latest.release'
    testImplementation 'net.runelite:client:latest.release'
    testImplementation 'net.runelite:jshell:latest.release'
    testImplementation 'junit:junit:4.13.2'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(11)
}

tasks.register('run', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.tfadrytracker.TfaDryTrackerLauncher'
    jvmArgs '-ea'
    args '--developer-mode'
}

tasks.register('shadowJar', Jar) {
    dependsOn testClasses
    archiveClassifier.set('all')
    manifest { attributes('Main-Class': 'com.tfadrytracker.TfaDryTrackerLauncher', 'Multi-Release': 'true') }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from sourceSets.main.output
    from sourceSets.test.output
    from { configurations.testRuntimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    exclude 'META-INF/INDEX.LIST', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', '**/module-info.class'
}
